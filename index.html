<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Птичка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #4ec0ca;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(function () {
  'use strict';

  // ---------- Telegram ----------
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    try { tg.ready(); tg.expand(); } catch (e) {}
    try { if (tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch (e) {}
    try { tg.setHeaderColor('#4ec0ca'); tg.setBackgroundColor('#4ec0ca'); } catch (e) {}
  }

  function haptic(kind) {
    try {
      const h = tg && tg.HapticFeedback;
      if (!h) return;
      if (kind === 'flap') h.impactOccurred('light');
      else if (kind === 'dead') h.notificationOccurred('error');
    } catch (e) {}
  }

  // ---------- Настройки игры ----------
  const W = 360, H = 640, GROUND_H = 90;
  const GRAVITY = 1500, FLAP_V = -430, MAX_FALL = 720;
  const PIPE_W = 60, GAP = 160, PIPE_SPEED = 140, PIPE_SPACING = 210;
  const SPAWN_X = W + 30;
  const BIRD_X = 95, BIRD_R = 14;

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  let state = 'ready'; // ready | playing | dead
  let bird, pipes, score, best, newBest, groundX = 0, deadAt = 0, time = 0;

  const clouds = [
    { x: 60, y: 110, s: 1 },
    { x: 230, y: 200, s: 0.7 },
    { x: 330, y: 70, s: 0.85 },
    { x: 120, y: 300, s: 0.6 }
  ];

  function loadBest() {
    try { return Number(localStorage.getItem('birdgame_best')) || 0; } catch (e) { return 0; }
  }
  function saveBest(v) {
    try { localStorage.setItem('birdgame_best', String(v)); } catch (e) {}
  }

  function reset() {
    bird = { y: H * 0.42, vy: 0, rot: 0 };
    pipes = [];
    score = 0;
    newBest = false;
    state = 'ready';
  }

  function spawnPipe() {
    const min = 70 + GAP / 2;
    const max = H - GROUND_H - 70 - GAP / 2;
    pipes.push({ x: SPAWN_X, gapY: min + Math.random() * (max - min), passed: false });
  }

  function die() {
    state = 'dead';
    deadAt = performance.now();
    if (score > best) {
      best = score;
      newBest = true;
      saveBest(best);
    }
    haptic('dead');
  }

  function flap() {
    if (state === 'ready') state = 'playing';
    if (state === 'playing') {
      bird.vy = FLAP_V;
      haptic('flap');
    } else if (state === 'dead') {
      if (performance.now() - deadAt > 600) reset();
    }
  }

  function circleRect(cx, cy, r, rx, ry, rw, rh) {
    const nx = Math.max(rx, Math.min(cx, rx + rw));
    const ny = Math.max(ry, Math.min(cy, ry + rh));
    const dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy < r * r;
  }

  // ---------- Логика ----------
  function update(dt) {
    time += dt;
    const groundY = H - GROUND_H;

    if (state !== 'dead') {
      groundX = (groundX + PIPE_SPEED * dt) % 24;
      for (const c of clouds) {
        c.x -= 18 * c.s * dt;
        if (c.x < -80) c.x = W + 80;
      }
    }

    if (state === 'ready') {
      bird.y = H * 0.42 + Math.sin(time * 5) * 8;
      bird.rot = 0;
      return;
    }

    bird.vy = Math.min(bird.vy + GRAVITY * dt, MAX_FALL);
    bird.y += bird.vy * dt;
    bird.rot = Math.max(-0.45, Math.min(1.3, bird.vy / 500));

    if (state === 'dead') {
      if (bird.y + BIRD_R >= groundY) {
        bird.y = groundY - BIRD_R;
        bird.vy = 0;
      }
      return;
    }

    // playing
    for (const p of pipes) p.x -= PIPE_SPEED * dt;
    if (!pipes.length || pipes[pipes.length - 1].x <= SPAWN_X - PIPE_SPACING) spawnPipe();
    if (pipes.length && pipes[0].x + PIPE_W < -10) pipes.shift();

    for (const p of pipes) {
      if (!p.passed && p.x + PIPE_W < BIRD_X - BIRD_R) {
        p.passed = true;
        score++;
      }
    }

    if (bird.y - BIRD_R < 0) {
      bird.y = BIRD_R;
      if (bird.vy < 0) bird.vy = 0;
    }

    if (bird.y + BIRD_R >= groundY) {
      bird.y = groundY - BIRD_R;
      die();
      return;
    }

    const r = BIRD_R - 2;
    for (const p of pipes) {
      const topH = p.gapY - GAP / 2;
      const botY = p.gapY + GAP / 2;
      if (circleRect(BIRD_X, bird.y, r, p.x, 0, PIPE_W, topH) ||
          circleRect(BIRD_X, bird.y, r, p.x, botY, PIPE_W, H - botY)) {
        die();
        return;
      }
    }
  }

  // ---------- Рисование ----------
  function drawCloud(c) {
    const s = c.s;
    ctx.beginPath();
    ctx.arc(c.x, c.y, 22 * s, 0, Math.PI * 2);
    ctx.arc(c.x + 24 * s, c.y + 6 * s, 18 * s, 0, Math.PI * 2);
    ctx.arc(c.x - 24 * s, c.y + 8 * s, 16 * s, 0, Math.PI * 2);
    ctx.arc(c.x + 4 * s, c.y + 12 * s, 20 * s, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawPipe(p) {
    const top = p.gapY - GAP / 2;
    const bot = p.gapY + GAP / 2;
    const capH = 24, capExtra = 4;
    ctx.fillStyle = '#73bf2e';
    ctx.strokeStyle = '#2d5a16';
    ctx.lineWidth = 3;

    ctx.fillRect(p.x, -5, PIPE_W, top - capH + 5);
    ctx.strokeRect(p.x, -5, PIPE_W, top - capH + 5);
    ctx.fillRect(p.x - capExtra, top - capH, PIPE_W + capExtra * 2, capH);
    ctx.strokeRect(p.x - capExtra, top - capH, PIPE_W + capExtra * 2, capH);

    ctx.fillRect(p.x - capExtra, bot, PIPE_W + capExtra * 2, capH);
    ctx.strokeRect(p.x - capExtra, bot, PIPE_W + capExtra * 2, capH);
    ctx.fillRect(p.x, bot + capH, PIPE_W, H - bot - capH);
    ctx.strokeRect(p.x, bot + capH, PIPE_W, H - bot - capH);

    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.fillRect(p.x + 8, 0, 8, top - capH);
    ctx.fillRect(p.x + 8, bot + capH, 8, H - bot - capH);
  }

  function drawGround() {
    const gy = H - GROUND_H;
    ctx.fillStyle = '#ded895';
    ctx.fillRect(0, gy, W, GROUND_H);
    ctx.fillStyle = '#73bf2e';
    ctx.fillRect(0, gy, W, 14);
    ctx.fillStyle = '#5a9f21';
    for (let x = -groundX; x < W + 24; x += 24) {
      ctx.beginPath();
      ctx.moveTo(x, gy);
      ctx.lineTo(x + 12, gy);
      ctx.lineTo(x + 4, gy + 14);
      ctx.lineTo(x - 8, gy + 14);
      ctx.closePath();
      ctx.fill();
    }
    ctx.fillStyle = '#2d5a16';
    ctx.fillRect(0, gy, W, 3);
  }

  function drawBird() {
    ctx.save();
    ctx.translate(BIRD_X, bird.y);
    ctx.rotate(bird.rot);
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = '#543847';

    ctx.fillStyle = '#f7d31c';
    ctx.beginPath();
    ctx.arc(0, 0, BIRD_R + 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    const wing = state === 'dead' ? 0 : Math.sin(time * (state === 'playing' ? 25 : 10));
    ctx.fillStyle = '#f0a500';
    ctx.beginPath();
    ctx.ellipse(-4, 3, 8, 5 + wing * 2, -0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(7, -5, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(9, -5, 2, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#f06a1d';
    ctx.beginPath();
    ctx.moveTo(10, 2);
    ctx.lineTo(23, 4);
    ctx.lineTo(10, 9);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  function drawText(str, x, y, size, color) {
    ctx.font = 'bold ' + size + 'px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.lineWidth = Math.max(3, size / 7);
    ctx.strokeStyle = '#543847';
    ctx.strokeText(str, x, y);
    ctx.fillStyle = color || '#fff';
    ctx.fillText(str, x, y);
  }

  function roundRectPath(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#4ec0ca');
    g.addColorStop(1, '#bfe9f0');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    for (const c of clouds) drawCloud(c);

    for (const p of pipes) drawPipe(p);
    drawGround();
    drawBird();

    if (state === 'ready') {
      drawText('Птичка', W / 2, 140, 52);
      drawText('Нажмите, чтобы взлететь', W / 2, 330, 20);
      if (best > 0) drawText('Рекорд: ' + best, W / 2, 370, 18, '#ffd54a');
    } else if (state === 'playing') {
      drawText(String(score), W / 2, 80, 56);
    } else {
      roundRectPath(W / 2 - 130, 150, 260, 210, 16);
      ctx.fillStyle = '#ded895';
      ctx.fill();
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#543847';
      ctx.stroke();
      drawText('Игра окончена', W / 2, 190, 26);
      drawText('Счёт: ' + score, W / 2, 240, 24);
      drawText('Рекорд: ' + best, W / 2, 278, 24, '#ffd54a');
      if (newBest) drawText('Новый рекорд!', W / 2, 322, 18, '#ffd54a');
      if (performance.now() - deadAt > 600) {
        drawText('Нажмите, чтобы играть снова', W / 2, 410, 18);
      }
    }
  }

  // ---------- Размер и ввод ----------
  function resize() {
    const s = Math.min(window.innerWidth / W, window.innerHeight / H);
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.style.width = Math.floor(W * s) + 'px';
    canvas.style.height = Math.floor(H * s) + 'px';
    canvas.width = Math.round(W * s * dpr);
    canvas.height = Math.round(H * s * dpr);
    ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  }
  window.addEventListener('resize', resize);
  if (tg && tg.onEvent) tg.onEvent('viewportChanged', resize);

  window.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    flap();
  });
  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      if (!e.repeat) flap();
    }
  });
  window.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  // ---------- Запуск ----------
  best = loadBest();
  reset();
  resize();

  let last = null;
  function loop(t) {
    if (last === null) last = t;
    const dt = Math.min((t - last) / 1000, 0.033);
    last = t;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
